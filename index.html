<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ultimate BDC Logo</title>
  <style>
    :root { color-scheme: light; font-family: Arial, sans-serif; }
    body { min-height: 100vh; margin: 0; display: grid; place-items: center; background: #f4f7f8; color: #183643; }
    main { text-align: center; padding: 2rem; }
    img { width: 128px; height: 128px; object-fit: contain; }
    h1 { margin: 1rem 0 0; font-size: 1.35rem; letter-spacing: .12em; }
  </style>
</head>
<body>
  <main>
    <img src="ultimate-bdc-logo.png" alt="Ultimate BDC logo">
    <h1>ULTIMATE BDC</h1>
  </main>
</body>
</html>
